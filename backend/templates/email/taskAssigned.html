<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: #f4f4f5;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .content {
            padding: 30px;
        }

        .task-card {
            background: #f9fafb;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin: 20px 0;
            border-radius: 6px;
        }

        .task-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin: 0 0 10px;
        }

        .task-meta {
            display: flex;
            gap: 20px;
            margin: 10px 0;
        }

        .meta-item {
            font-size: 14px;
            color: #6b7280;
        }

        .meta-label {
            font-weight: 600;
            color: #374151;
        }

        .button {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            margin: 20px 0;
        }

        .footer {
            background: #f9fafb;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #e5e7eb;
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>📋 New Task Assigned</h1>
        </div>
        <div class="content">
            <p>Hi <strong>{{userName}}</strong>,</p>
            <p>You have been assigned a new task in <strong>{{projectName}}</strong>.</p>

            <div class="task-card">
                <div class="task-title">{{taskTitle}}</div>
                <p>{{taskDescription}}</p>
                <div class="task-meta">
                    <div class="meta-item"><span class="meta-label">Priority:</span> {{priority}}</div>
                    <div class="meta-item"><span class="meta-label">Due Date:</span> {{dueDate}}</div>
                </div>
            </div>

            <div style="text-align: center;">
                <a href="{{taskLink}}" class="button">View Task</a>
            </div>

            <p style="color: #6b7280; font-size: 14px; margin-top: 30px;">
                Assigned by <strong>{{assignedBy}}</strong>
            </p>
        </div>
        <div class="footer">
            <p><strong>ProjectFlow</strong></p>
            <p>This is an automated email. Please do not reply.</p>
        </div>
    </div>
</body>

</html>
