<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Use Case Diagram - Enterprise Workflow Management System</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: #fafafa; 
            padding: 40px; 
            margin: 0;
        }
        .canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .canvas { 
            background: white; 
            border: 1px solid #e0e0e0; 
            padding: 20px; 
        }
        .use-case-text { 
            font-size: 13px; 
            text-anchor: middle; 
            dominant-baseline: middle; 
            fill: #111; 
            pointer-events: none; 
        }
        .system-title { 
            font-size: 16px; 
            font-weight: 600; 
            text-anchor: middle; 
            fill: #222; 
        }
        .actor-title { 
            font-size: 14px; 
            text-anchor: middle; 
            fill: #333; 
        }
        .caption { 
            font-weight: bold; 
            text-align: center; 
            margin-top: 20px; 
            font-size: 17px; 
            font-family: "Times New Roman", Times, serif; 
        }
    </style>
</head>
<body>
    <div class="canvas-container">
        <div class="canvas">
            <svg width="860" height="600" viewBox="0 0 860 600" xmlns="http://www.w3.org/2000/svg">
                
                <!-- System Boundary Box -->
                <rect x="150" y="40" width="560" height="530" fill="none" stroke="black" stroke-width="1" />
                <rect x="165" y="80" width="530" height="475" fill="none" stroke="#ddd" stroke-dasharray="5,5" stroke-width="1" />
                
                <!-- System Label -->
                <text x="430" y="65" class="system-title">Enterprise Workflow System</text>
                
                <!-- Center Divider Line -->
                <line x1="430" y1="80" x2="430" y2="480" stroke="#ddd" stroke-dasharray="5,5" stroke-width="1" />

                <!-- Component Definitions -->
                <defs>
                    <g id="usecase">
                        <ellipse cx="0" cy="0" rx="95" ry="25" fill="#e2e8f0" stroke="#475569" stroke-width="1" />
                    </g>
                    <g id="actor">
                        <circle cx="0" cy="-20" r="8" fill="white" stroke="black" stroke-width="1.5" />
                        <line x1="0" y1="-12" x2="0" y2="15" stroke="black" stroke-width="1.5" />
                        <line x1="-15" y1="0" x2="15" y2="0" stroke="black" stroke-width="1.5" />
                        <line x1="0" y1="15" x2="-15" y2="35" stroke="black" stroke-width="1.5" />
                        <line x1="0" y1="15" x2="15" y2="35" stroke="black" stroke-width="1.5" />
                    </g>
                </defs>

                <!-- ================= ACTORS ================= -->
                
                <!-- Left Actor 1: Member -->
                <g transform="translate(60, 200)">
                    <use href="#actor" />
                    <text x="0" y="55" class="actor-title">Member</text>
                </g>
                
                <!-- Left Actor 2: Manager -->
                <g transform="translate(60, 380)">
                    <use href="#actor" />
                    <text x="0" y="55" class="actor-title">Manager</text>
                </g>

                <!-- Right Actor: Admin -->
                <g transform="translate(800, 290)">
                    <use href="#actor" />
                    <text x="0" y="55" class="actor-title">Admin</text>
                </g>

                <!-- ================= CONNECTIONS ================= -->

                <!-- Member Connections -->
                <line x1="60" y1="200" x2="280" y2="120" stroke="#333" stroke-width="1" fill="none"/>
                <line x1="60" y1="200" x2="280" y2="180" stroke="#333" stroke-width="1" fill="none"/>
                <line x1="60" y1="200" x2="280" y2="240" stroke="#333" stroke-width="1" fill="none"/>

                <!-- Manager Connections -->
                <line x1="60" y1="380" x2="280" y2="320" stroke="#333" stroke-width="1" fill="none"/>
                <line x1="60" y1="380" x2="280" y2="380" stroke="#333" stroke-width="1" fill="none"/>
                <line x1="60" y1="380" x2="280" y2="440" stroke="#333" stroke-width="1" fill="none"/>
                <line x1="60" y1="380" x2="280" y2="240" stroke="#333" stroke-width="1" fill="none"/> <!-- Manager sharing Log Work hours -->

                <!-- Admin Connections -->
                <line x1="800" y1="290" x2="580" y2="160" stroke="#333" stroke-width="1" fill="none"/>
                <line x1="800" y1="290" x2="580" y2="230" stroke="#333" stroke-width="1" fill="none"/>
                <line x1="800" y1="290" x2="580" y2="300" stroke="#333" stroke-width="1" fill="none"/>
                <line x1="800" y1="290" x2="580" y2="370" stroke="#333" stroke-width="1" fill="none"/>

                <!-- Connections to Single Shared Node at Bottom -->
                <path d="M 60 200 L 430 520" stroke="#94a3b8" stroke-dasharray="5,5" stroke-width="1" fill="none" opacity="0.6"/>
                <path d="M 60 380 L 430 520" stroke="#94a3b8" stroke-dasharray="5,5" stroke-width="1" fill="none" opacity="0.6"/>
                <path d="M 800 290 L 430 520" stroke="#94a3b8" stroke-dasharray="5,5" stroke-width="1" fill="none" opacity="0.6"/>

                <!-- ================= USE CASES ================= -->

                <!-- Member/Manager Group (Left Side) -->
                <!-- x = 280 -->
                <g transform="translate(280, 120)">
                    <use href="#usecase" />
                    <text x="0" y="2" class="use-case-text">View Assigned Work</text>
                </g>
                <g transform="translate(280, 180)">
                    <use href="#usecase" />
                    <text x="0" y="2" class="use-case-text">Update Task Progress</text>
                </g>
                <g transform="translate(280, 240)">
                    <use href="#usecase" />
                    <text x="0" y="2" class="use-case-text">Log Work Hours &amp; Files</text>
                </g>

                <g transform="translate(280, 320)">
                    <use href="#usecase" />
                    <text x="0" y="2" class="use-case-text">Create &amp; Manage Projects</text>
                </g>
                <g transform="translate(280, 380)">
                    <use href="#usecase" />
                    <text x="0" y="2" class="use-case-text">Assign Team Tasks</text>
                </g>
                <g transform="translate(280, 440)">
                    <use href="#usecase" />
                    <text x="0" y="2" class="use-case-text">View Workload Analytics</text>
                </g>

                <!-- Admin Group (Right Side) -->
                <!-- x = 580 -->
                <g transform="translate(580, 160)">
                    <use href="#usecase" />
                    <text x="0" y="2" class="use-case-text">Manage User Roles</text>
                </g>
                <g transform="translate(580, 230)">
                    <use href="#usecase" />
                    <text x="0" y="2" class="use-case-text">Configure Integrations</text>
                </g>
                <g transform="translate(580, 300)">
                    <use href="#usecase" />
                    <text x="0" y="2" class="use-case-text">Monitor Audit Logs</text>
                </g>
                <g transform="translate(580, 370)">
                    <use href="#usecase" />
                    <text x="0" y="2" class="use-case-text">Platform Administration</text>
                </g>

                <!-- Shared Notification Use Case (Bottom Center) -->
                <g transform="translate(430, 520)">
                    <use href="#usecase" style="fill: #cbd5e1" />
                    <text x="0" y="2" class="use-case-text">Receive Notifications</text>
                </g>

            </svg>
        </div>
        <div class="caption">Figure 4.3.1.1 &ndash; Use Case Diagram</div>
    </div>
</body>
</html>
